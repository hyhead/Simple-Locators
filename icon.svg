<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1f22" />
      <stop offset="100%" stop-color="#2b2d31" />
    </linearGradient>

    <!-- Target Frame Gradient -->
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ab4f8" />
      <stop offset="100%" stop-color="#c58af9" />
    </linearGradient>

    <!-- Code Accent Gradient -->
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81c995" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="128" height="128" rx="26" fill="url(#bgGrad)" stroke="#3c4043" stroke-width="4" />

  <!-- Target / Selection Focus Corners -->
  <path d="M 32 46 V 38 Q 32 32 38 32 H 46" fill="none" stroke="url(#targetGrad)" stroke-width="7" stroke-linecap="round" />
  <path d="M 96 46 V 38 Q 96 32 90 32 H 82" fill="none" stroke="url(#targetGrad)" stroke-width="7" stroke-linecap="round" />
  <path d="M 32 82 V 90 Q 32 96 38 96 H 46" fill="none" stroke="url(#targetGrad)" stroke-width="7" stroke-linecap="round" />
  <path d="M 96 82 V 90 Q 96 96 90 96 H 82" fill="none" stroke="url(#targetGrad)" stroke-width="7" stroke-linecap="round" />

  <!-- Dotted Selection Box -->
  <rect x="36" y="36" width="56" height="56" rx="8" fill="none" stroke="#8ab4f8" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />

  <!-- Center Code Selector Symbol (< />) -->
  <path d="M 50 54 L 41 64 L 50 74" fill="none" stroke="url(#codeGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 78 54 L 87 64 L 78 74" fill="none" stroke="url(#codeGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="68" y1="52" x2="60" y2="76" stroke="#fdd663" stroke-width="5" stroke-linecap="round" />
</svg>
