<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="container">

    <!-- iFrame Detection Banner -->
    <div id="iframe-banner" class="iframe-banner" hidden>
      <span class="iframe-icon">🖼️</span>
      <span>Element is inside an <strong>iFrame</strong> (<span id="iframe-info"></span>)</span>
    </div>

    <!-- Live Selector Tester (Top) -->
    <div class="section">
      <div class="header">
        <span class="label">Live Selector Tester</span>
        <span id="test-badge" class="badge default">0 matches</span>
      </div>
      <div class="tester-wrap">
        <input type="text" id="test-input" placeholder="Type CSS or XPath selector..." autocomplete="off" spellcheck="false">
      </div>
    </div>

    <!-- CSS Selector -->
    <div class="section">
      <div class="header">
        <span class="label">CSS Selector</span>
        <button id="copy-css" class="icon-btn" title="Copy CSS Selector">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
      </div>
      <div class="locator-wrap">
        <code id="css-val" title="Hover to highlight elements on page">Select an element to inspect</code>
        <div id="css-warning" class="warning" hidden aria-live="polite"></div>
      </div>
    </div>

    <!-- XPath -->
    <div class="section">
      <div class="header">
        <span class="label">XPath</span>
        <button id="copy-xpath" class="icon-btn" title="Copy XPath">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </button>
      </div>
      <div class="locator-wrap">
        <code id="xpath-val" title="Hover to highlight elements on page">Select an element to inspect</code>
        <div id="xpath-warning" class="warning" hidden aria-live="polite"></div>
      </div>
    </div>

       <!-- Page Scanner (Middle & Featured) -->
    <div class="section scanner-section">
      <div class="header">
        <span class="label scanner-label">Page Scanner</span>
        <div class="scanner-controls">
          <button id="scan-page-btn" class="scan-btn" disabled>⚡ Scan Page</button>
          <select id="locator-format" class="format-select" title="Toggle Locator Format">
            <option value="xpath" selected>XPath</option>
            <option value="css">CSS</option>
          </select>
        </div>
      </div>
      <div id="scanner-results" class="scanner-results">
        <div class="empty-msg">Click scan to find inputs, buttons, links, and data-testid elements.</div>
      </div>
    </div>

    <!-- Highlighted Footer Hint -->
    <div class="footer-hint">
      <span class="hint-icon">💡</span>
      <span>Click to copy & inspect • Hover locator box to highlight on page</span>
    </div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
